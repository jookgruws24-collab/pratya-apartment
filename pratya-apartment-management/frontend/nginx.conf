server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # แอปเป็น Single Page App (React Router) — ทุก path ที่หาไฟล์ไม่เจอ
    # ให้ส่ง index.html กลับไป เพื่อให้ react-router จัดการเส้นทางเอง
    location / {
        try_files $uri $uri/ /index.html;
    }
}
